[project]
name = "hospital-cost-forecast"
version = "0.1.0"
description = "Predicts the cost of a hospital admission at the moment of admission, using public SUS data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "datasus-dbc>=0.1.3",
    "fastapi>=0.163.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
costmodel = "costmodel.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end tests that run the command line (deselect with -m 'not slow')"]
# FastAPI's TestClient still runs on httpx; the notice is about a successor package, not about our code.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
