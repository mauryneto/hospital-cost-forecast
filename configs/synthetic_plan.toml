# Made-up health-plan data (TUSS codes), to try the "fill the template and run" path:
#   uv run costmodel synthetic && uv run costmodel data --config configs/synthetic_plan.toml
name = "synthetic_plan"

[source]
type = "file"
path = "data/synthetic_admissions.csv"

[split]
mode = "relative"
monitor_months = 12
test_months = 12
valid_months = 12

[contract]
max_paid_amount = 5_000_000

[train]
objectives = ["tweedie", "log_l2"]
num_leaves = [31, 63]
sliding_months = [24]

[gate]
min_mae_gain = 0.02
min_total_gain = 0.10
max_monthly_total_mape = 15.0

[monitor]
label_delay_months = 3  # months until (almost) every admission of a month has its cost; measure it on your data
mae_tolerance = 0.10
patience = 2

[replay]
policies = ["never", "rule", "monthly"]
windows = [0]
gate_months = 2
