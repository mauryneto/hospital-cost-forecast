# The 2025 check: SIH/SUS admissions, Rio de Janeiro state, with one more year that no choice was made on.
# A dataset of its own, so the published reports of `sihsus_rj` (2018-2024) stay exactly reproducible.
# The protocol is in DECISIONS.md ("The 2025 check: written before looking"); everything in [fresh] was fixed and
# committed before any 2025 cost was read.
name = "sihsus_rj_2025"

[source]
type = "sihsus"
uf = "RJ"
# Same rule as `sihsus_rj`: billing months run six months past the last admission month.
first_billing_month = "2018-01"
last_billing_month = "2026-06"
first_admission = "2018-01-01"
last_admission = "2025-12-31"

[split]
# The windows every choice was made on, as in `sihsus_rj`. `costmodel fresh` does not use them: it reads [fresh].
mode = "dates"
train = ["2018-01-01", "2021-12-31"]
valid = ["2022-01-01", "2022-12-31"]
test = ["2023-01-01", "2023-12-31"]
monitor = ["2024-01-01", "2024-12-31"]

[contract]
max_paid_amount = 1_000_000

[train]
# Only what a fit needs is read here (learning rate, rare-category threshold, seed); nothing is searched.
learning_rate = 0.1
min_category_count = 20
seed = 42

[gate]
min_mae_gain = 0.02
min_total_gain = 0.10
max_monthly_total_mape = 15.0

[monitor]
label_delay_months = 3
mae_tolerance = 0.10
patience = 2

[replay]
policies = ["never", "rule", "monthly"]
windows = [0, 24]
gate_months = 2

[fresh]
# The year scored. The model for it is fitted at the end of the month before, with the admissions whose costs are
# known by then ([monitor] label_delay_months).
window = ["2025-01-01", "2025-12-31"]
# Version 3 of `cost-sihsus_rj`, the model in production, was fitted on admissions up to this date.
production_fit_until = "2022-12-31"

# The two settings of version 3, with the number of trees its search found. Nothing is tuned.
[fresh.typical]
objective = "log_l2"
num_leaves = 255
trees = 324
use_time = true

[fresh.expected]
objective = "tweedie"
num_leaves = 63
trees = 303
use_time = true

# The idea from `costmodel segments` that looked good on 2022: surgical admissions (procedure group 04) get a
# typical-cost model of their own, with the number of trees that run found for it.
[fresh.own_model]
column = "procedure_prefix2"
value = "04"
trees = 107
